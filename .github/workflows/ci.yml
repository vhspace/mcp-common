name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Independent uv projects (no workspace): the mcp-common library at the repo
# root, and each MCP server under servers/*. Each is linted/typed/tested in its
# own directory against its own uv.lock.
#
# Shared per-job setup (uv + Python + git auth for the private mcp-common pin)
# lives in ./.github/actions/setup. checkout stays in each job because a local
# composite action can only be resolved after the repo is checked out.
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "servers/netbox-mcp", "servers/dc-support-mcp", "servers/awx-mcp", "servers/mcp-network"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup
        with:
          python-version: "3.13"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync --all-groups

      - name: Ruff check
        working-directory: ${{ matrix.project }}
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        working-directory: ${{ matrix.project }}
        run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "servers/netbox-mcp", "servers/dc-support-mcp", "servers/awx-mcp", "servers/mcp-network"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup
        with:
          python-version: "3.13"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync --all-groups

      - name: Mypy
        continue-on-error: true
        working-directory: ${{ matrix.project }}
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "servers/netbox-mcp", "servers/dc-support-mcp", "servers/awx-mcp", "servers/mcp-network"]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync --all-groups

      - name: Unit tests
        working-directory: ${{ matrix.project }}
        run: uv run pytest -q -m "not integration and not e2e and not slow"

  # Real-NetBox integration tests for netbox-mcp (issue #60). Boots a
  # self-contained NetBox v4.3.2 simulator in Docker (stock images, seeded via
  # the REST API) and runs the suite marked ``integration`` — which the fast
  # ``test`` job above deliberately excludes. GitHub-hosted ubuntu runners ship
  # Docker, so NETBOX_REQUIRE_DOCKER=1 makes a missing runtime fail loudly
  # rather than skip; NETBOX_IT_CLEAN=1 tears the DB volume down afterwards.
  netbox-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Cancel a superseded in-flight run when new commits land on the same ref.
    concurrency:
      group: netbox-it-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Only pay for the ~3-4 min Docker boot when netbox-mcp (or this workflow)
      # actually changed. The job itself still runs and reports a status on every
      # PR/push (a fully ``if:``-skipped job can leave a required check pending),
      # but the expensive setup + simulator steps below are gated on this filter.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: changes
        with:
          filters: |
            netbox:
              - 'servers/netbox-mcp/**'
              - '.github/workflows/ci.yml'

      - uses: ./.github/actions/setup
        if: steps.changes.outputs.netbox == 'true'
        with:
          python-version: "3.13"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.changes.outputs.netbox == 'true'
        working-directory: servers/netbox-mcp
        run: uv sync --all-groups

      - name: Integration tests (NetBox simulator)
        if: steps.changes.outputs.netbox == 'true'
        working-directory: servers/netbox-mcp
        env:
          NETBOX_REQUIRE_DOCKER: "1"
          NETBOX_IT_CLEAN: "1"
        run: uv run pytest -m integration -q
