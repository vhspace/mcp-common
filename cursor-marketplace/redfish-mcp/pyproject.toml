[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[project]
name = "redfish-mcp"
version = "2.26.2"
description = "Redfish MCP server for managing BMC/IPMI on Redfish-enabled systems"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["mcp", "model-context-protocol", "redfish", "bmc", "ipmi", "firmware"]
authors = [{ name = "Together AI" }]
dependencies = [
    "fastmcp>=3.4.2,<4",
    "httpx>=0.28.1",
    "mcp>=1.20.0",
    "mcp-common>=0.38,<1",
    "pexpect>=4.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "typer>=0.15.0",
    "vncdotool>=1.3.0",
]

[project.scripts]
redfish-mcp = "redfish_mcp.mcp_server:main"
redfish-cli = "redfish_mcp.cli:main"

[project.optional-dependencies]
kvm = []
kvm-playwright = [
    "playwright>=1.40",
]

[tool.uv.sources]
# dev-only pin: the dev commit that introduces mcp_common.cli.should_emit_json
# (auto-JSON when stdout is not a TTY), since no released tag carries it yet.
# Re-pin to a tagged mcp-common release when promoting dev -> main / cutting the
# next release.
mcp-common = { git = "https://github.com/togethercomputer/mcp-common", rev = "8cf61229c0f25712c7106e77145689afb3243bfa" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E501", "SIM102", "SIM105", "SIM108", "SIM117", "UP047"]

[tool.ruff.lint.per-file-ignores]
# typer.Option() in function defaults is intentional
"src/redfish_mcp/cli.py" = ["B008"]
"src/redfish_mcp/kvm/cli_commands.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests (requires REDFISH_IP/USER/PASSWORD)",
    "e2e: end-to-end tests",
    "subprocess: tests that spawn real Xvfb/Java/x11vnc subprocesses (requires apt deps)",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "pytest-httpx>=0.34",
    "inline-snapshot>=0.15",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "responses>=0.25.0",
    "types-requests>=2.32.0",
]
