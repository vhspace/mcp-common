[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[project]
name = "mcp-network"
version = "1.1.3"
description = "MCP server for read-only access to Together AI network switches (initially the ORI-TX NVIDIA Cumulus Linux fabric)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["mcp", "model-context-protocol", "network", "cumulus", "switches"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "asyncssh>=2.18",
    "fastmcp>=3.4.0,<4",
    "jsonschema>=4.21",
    "mcp-common>=0.38,<1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.15.0",
    "uvicorn>=0.34",
]

[project.scripts]
mcp-network = "mcp_network.server:main"
network-cli = "mcp_network.cli:main"

[tool.uv.sources]
mcp-common = { git = "https://github.com/togethercomputer/mcp-common", tag = "mcp-common-v0.38.0" }


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E501", "SIM102", "SIM105", "SIM108", "SIM117", "UP047"]

[tool.ruff.lint.per-file-ignores]
"src/mcp_network/cli.py" = ["B008"]  # typer.Option()/Argument() in defaults is intentional


[tool.mypy]
python_version = "3.12"
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "live: tests that require live fleet access (gated by MCP_NETWORK_RUN_LIVE=1)",
]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "pytest-httpx>=0.34",
    "httpx>=0.28",
    "inline-snapshot>=0.15",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
]
