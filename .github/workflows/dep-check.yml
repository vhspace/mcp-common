name: Dependency Staleness Check

# Scheduled signal (issue #68) to catch stale or conflicting dependency pins
# early. It specifically guards the cross-repo git-tag pins in
# `[tool.uv.sources]` that Dependabot does NOT track (see .github/dependabot.yml)
# — the class of staleness that broke maas-mcp when a stale redfish-mcp pin
# pulled in an incompatible mcp-common. `uv lock --check` fails if uv.lock is
# out of date with pyproject.toml; `uv sync --frozen` then verifies the locked
# set (including any git-tag pins) still resolves and installs.
#
# Runs only on a schedule and on manual dispatch, so it never blocks day-to-day
# PR / push CI. A failed scheduled run is the visible signal for maintainers.

on:
  schedule:
    # Mondays 08:00 UTC — clusters with the weekly Dependabot run.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-check:
    runs-on: ${{ vars.USE_GITHUB_HOSTED == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","vhspace-ci"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Clean stale files (self-hosted runner hygiene)
        run: git clean -fdx src/ tests/

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: uv lock --check (uv.lock in sync with pyproject.toml)
        run: |
          if ! uv lock --check; then
            echo "::error title=Stale uv.lock::uv.lock is out of date with pyproject.toml. Run 'uv lock' locally and commit the result. For repos with [tool.uv.sources] git-tag pins, also bump the pinned tags — Dependabot does not. See issue #68."
            exit 1
          fi

      - name: uv sync --frozen (locked dependency set resolves & installs)
        run: |
          if ! uv sync --frozen --all-groups; then
            echo "::error title=Frozen sync failed::The locked dependency set failed to resolve/install from uv.lock. A git-tag pin in [tool.uv.sources] may be stale or unresolvable. See issue #68."
            exit 1
          fi
