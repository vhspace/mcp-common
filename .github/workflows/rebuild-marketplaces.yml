name: Rebuild Marketplaces

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would be built without committing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-groups

      # Build marketplace artifacts directly from in-repo server sources under
      # servers/*. Each server dir carries mcp-plugin.toml + pyproject.toml, which
      # is all the marketplace builder needs — no cross-repo cloning or tokens.
      - name: Build all marketplaces
        run: |
          set -euo pipefail
          DRY_RUN_FLAG=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          uv run python -m mcp_common.marketplace_builder \
            --repos-dir servers \
            --output-dir . \
            $DRY_RUN_FLAG

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chore/rebuild-marketplaces-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild marketplace directories"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "chore: rebuild marketplace directories" \
            --body "$(cat <<'EOF'
          ## Summary
          - Rebuilt marketplace directories from in-repo server sources (`servers/*`)
          - Platforms: cursor, opencode, openhands, claude

          Auto-generated by the rebuild-marketplaces workflow.
          EOF
          )"
