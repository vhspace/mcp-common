[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[project]
name = "dc-support-mcp"
version = "1.16.0"
description = "MCP server for datacenter vendor support portals (ORI Industries, IREN)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["mcp", "model-context-protocol", "datacenter", "support", "vendor"]
dependencies = [
    "fastmcp>=3.4.0,<4",
    "mcp-common>=0.39,<1",
    "playwright>=1.58.0",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "python-dotenv>=1.1.0",
    "typer>=0.15.0",
]

[project.scripts]
dc-support-mcp = "dc_support_mcp.mcp_server:main"
dc-support-setup = "dc_support_mcp.setup:main"
dc-support-cli = "dc_support_mcp.cli:main"







[tool.uv.sources]
# dev-only pin: the dev commit that introduces the build_cli_from_mcp(package_name=...)
# parameter (mcp-common 0.39.0, #71/#74), which gives dc-support-cli a --version for free.
# No released tag carries it yet. Re-pin to a tagged mcp-common release when promoting
# dev -> main / cutting the next release.
mcp-common = { git = "https://github.com/togethercomputer/mcp-common", rev = "8cf61229c0f25712c7106e77145689afb3243bfa" }


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E501", "SIM102", "SIM105", "SIM108", "SIM117", "UP047"]

[tool.ruff.lint.per-file-ignores]
"src/dc_support_mcp/cli.py" = ["B008"]  # typer.Option() in function defaults is intentional


[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests (requires credentials)",
    "slow: tests that involve browser automation",
]






[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "pytest-httpx>=0.34",
    "pytest-mock>=3.12.0",
    "inline-snapshot>=0.15",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "responses>=0.25.0",
    "types-requests>=2.32",
    "types-beautifulsoup4>=4.12",
]

