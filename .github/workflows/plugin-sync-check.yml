name: Plugin Sync Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install mcp-common CLI
        run: uv tool install "mcp-common[cli] @ git+https://github.com/vhspace/mcp-common"

      - name: Check plugin configs are in sync
        run: |
          if [ ! -f mcp-plugin.toml ]; then
            echo "No mcp-plugin.toml found, skipping sync check"
            exit 0
          fi
          mcp-plugin-gen check .
