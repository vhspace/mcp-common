version: 2
updates:
  # Monitor Python uv dependencies from GitHub repositories
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Monitor dependencies pinned via git tags in pyproject.toml
    allow:
      - dependency-name: "mcp-common"
      - dependency-name: "redfish-mcp"
      - dependency-name: "fastmcp"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"
  
  # Monitor uv-specific dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-name: "*"