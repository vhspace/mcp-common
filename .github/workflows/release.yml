name: Release

# Tag-triggered, per-package releases. Bump a package's pyproject version in a
# reviewed PR, then push a matching tag:
#   - mcp-common-v*  -> releases the root mcp-common library
#   - netbox-mcp-v*  -> releases servers/netbox-mcp
#   - awx-mcp-v*     -> releases servers/awx-mcp
#   - mcp-network-v* -> releases servers/mcp-network
#   - redfish-mcp-v* -> releases servers/redfish-mcp
# Tag pushes aren't subject to the protected-main PR rule, so this needs no
# deploy key or ruleset bypass.
on:
  push:
    tags:
      - "mcp-common-v*"
      - "netbox-mcp-v*"
      - "awx-mcp-v*"
      - "mcp-network-v*"
      - "redfish-mcp-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve package from tag
        id: pkg
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            mcp-common-v*) echo "dir=." >> "$GITHUB_OUTPUT"; echo "name=mcp-common" >> "$GITHUB_OUTPUT" ;;
            netbox-mcp-v*) echo "dir=servers/netbox-mcp" >> "$GITHUB_OUTPUT"; echo "name=netbox-mcp" >> "$GITHUB_OUTPUT" ;;
            awx-mcp-v*) echo "dir=servers/awx-mcp" >> "$GITHUB_OUTPUT"; echo "name=awx-mcp" >> "$GITHUB_OUTPUT" ;;
            mcp-network-v*) echo "dir=servers/mcp-network" >> "$GITHUB_OUTPUT"; echo "name=mcp-network" >> "$GITHUB_OUTPUT" ;;
            redfish-mcp-v*) echo "dir=servers/redfish-mcp" >> "$GITHUB_OUTPUT"; echo "name=redfish-mcp" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unrecognized release tag '$TAG'"; exit 1 ;;
          esac

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Build ${{ steps.pkg.outputs.name }}
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: uv build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Idempotent: skip if a release already exists for this tag.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes \
              "${{ steps.pkg.outputs.dir }}"/dist/*
