name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Independent uv projects (no workspace): the mcp-common library at the repo
# root, and each MCP server under servers/*. Each is linted/typed/tested in its
# own directory against its own uv.lock.
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "servers/netbox-mcp"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync --all-groups

      - name: Ruff check
        working-directory: ${{ matrix.project }}
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        working-directory: ${{ matrix.project }}
        run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "servers/netbox-mcp"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync --all-groups

      - name: Mypy
        continue-on-error: true
        working-directory: ${{ matrix.project }}
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "servers/netbox-mcp"]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync --all-groups

      - name: Unit tests
        working-directory: ${{ matrix.project }}
        run: uv run pytest -q -m "not integration and not e2e and not slow"
