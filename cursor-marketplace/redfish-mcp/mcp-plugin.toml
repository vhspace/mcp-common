# Universal MCP plugin config — single source of truth for all platforms.
# Run `mcp-plugin-gen` to produce Cursor, Claude Code, OpenCode, etc. configs.

name = "redfish-mcp"
description = "MCP server and CLI for Redfish BMC management -- firmware, BIOS, power, health, sensors"
repository = "https://github.com/togethercomputer/mcp-common"
subdirectory = "servers/redfish-mcp"
license = "Apache-2.0"
keywords = ["mcp", "redfish", "bmc", "ipmi", "firmware", "bios", "cli"]

[author]
name = "Together AI"

[server]
command = "uvx"
args = ["--from", "redfish-mcp", "redfish-mcp"]

[server.env]
REDFISH_USER = "${REDFISH_USER}"
REDFISH_PASSWORD = "${REDFISH_PASSWORD}"
VERIFY_SSL = "${VERIFY_SSL:-true}"

[cli]
name = "redfish-cli"
entry_point = "redfish_mcp.cli:main"
description = "Query and manage server BMC hardware via Redfish from the command line"

# One [[skills]] entry per skills/<name>/SKILL.md directory; `name` matches the
# directory and `path` points at that directory's SKILL.md (the netbox/awx
# convention). Every skill dir must be registered here or generation skips it
# and the skill never reaches agents (enforced by tests/test_skill_registration.py).
[[skills]]
name = "redfish-bmc-ops"
description = "Use when managing BMC/IPMI via Redfish, checking BIOS settings, firmware versions, power state, or BMC user accounts. Triggers on mentions of Redfish, BMC, IPMI, BIOS, firmware update, out-of-band management, or server power control."
path = "skills/redfish-bmc-ops/SKILL.md"

[[skills]]
name = "redfish-operations"
description = "Use when managing BMC/IPMI via Redfish, checking BIOS settings, firmware versions, power state, or BMC user accounts. Triggers on mentions of Redfish, BMC, IPMI, BIOS, firmware update, out-of-band management, or server power control."
path = "skills/redfish-operations/SKILL.md"

[[rules]]
name = "redfish-operations"
path = "rules/redfish-operations.mdc"

[[rules]]
name = "supermicro-bmc-patterns"
path = "rules/supermicro-bmc-patterns.mdc"

[[hooks]]
event = "SessionStart"
script = "hooks/setup-cli"
async = true

[marketplace]
categories = ["infrastructure", "hardware"]
tags = ["redfish", "bmc", "firmware", "bios"]
