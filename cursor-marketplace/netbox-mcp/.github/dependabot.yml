version: 2
updates:
  # Python dependencies via PEP 621 / uv
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Note: git tag dependencies in [tool.uv.sources] (e.g. mcp-common)
    # are NOT tracked by Dependabot's pip ecosystem. Track those manually
    # or via a scheduled CI check (see issue #78).

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
