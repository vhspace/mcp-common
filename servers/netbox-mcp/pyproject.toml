[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[project]
name = "netbox-mcp"
version = "2.23.1"
description = "A read-only MCP server for NetBox"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["mcp", "model-context-protocol", "netbox", "infrastructure"]
dependencies = [
    "fastmcp>=3.4.2,<4",
    "mcp-common>=0.38,<1",
    "requests>=2.31.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.15.0",
]

[project.scripts]
netbox-mcp = "netbox_mcp.server:main"
netbox-cli = "netbox_mcp.cli:main"

[project.optional-dependencies]
eval = [
    "inspect-ai>=0.3.241",
    "openai>=1.0",
    "tenacity>=8.0",
]



















[tool.uv.sources]
# dev-only pin: bumped to the commit that introduces ``build_cli_from_mcp(...,
# package_name=)`` (#74, 8cf6122) so netbox-cli can migrate to the framework
# ``--version`` wiring like the other four framework CLIs. Matches the pin
# already used by mcp-network / ufm-mcp / redfish-mcp. Re-pin to a tagged
# mcp-common release when promoting dev -> main / cutting the next release.
mcp-common = { git = "https://github.com/togethercomputer/mcp-common", rev = "8cf61229c0f25712c7106e77145689afb3243bfa" }


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E501", "SIM102", "SIM105", "SIM108", "SIM117", "UP047"]

[tool.ruff.lint.per-file-ignores]
"src/netbox_mcp/cli.py" = ["B008"]  # typer.Option() in function defaults is intentional


[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]



















[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "pytest-httpx>=0.34",
    "inline-snapshot>=0.15",
    "mypy>=2.1.0",
    "types-requests>=2.31",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pytest-cov>=7.0.0",
]

