name: HEAD compat canary

# Non-blocking drift signal: does servers/netbox-mcp still build + test against
# mcp-common HEAD (the unreleased in-repo library) rather than its pinned tag?
# A red run means netbox-mcp has drifted and should adopt/repin a new mcp-common.
# Intentionally a separate, NON-required workflow so it never blocks merges.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  netbox-vs-mcp-common-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Sync pulls netbox's pinned mcp-common (private git tag); needs the token.
      - name: Authenticate git for private mcp-common dependency
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: netbox-mcp tests against in-repo mcp-common HEAD
        working-directory: servers/netbox-mcp
        run: |
          uv sync --all-groups
          uv run --with-editable ../.. -- pytest -q -m "not integration and not e2e"
