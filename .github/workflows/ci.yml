name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Independent uv projects (no workspace): the mcp-common library at the repo
# root, and each MCP server under servers/*. Each is linted/typed/tested in its
# own directory against its own uv.lock.
#
# Shared per-job setup (uv + Python + git auth for the private mcp-common pin)
# lives in ./.github/actions/setup. checkout stays in each job because a local
# composite action can only be resolved after the repo is checked out.
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "servers/netbox-mcp"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup
        with:
          python-version: "3.13"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync --all-groups

      - name: Ruff check
        working-directory: ${{ matrix.project }}
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        working-directory: ${{ matrix.project }}
        run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "servers/netbox-mcp"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup
        with:
          python-version: "3.13"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync --all-groups

      - name: Mypy
        continue-on-error: true
        working-directory: ${{ matrix.project }}
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "servers/netbox-mcp"]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync --all-groups

      - name: Unit tests
        working-directory: ${{ matrix.project }}
        run: uv run pytest -q -m "not integration and not e2e and not slow"
