# Universal MCP plugin config — single source of truth for all platforms.
# Run `mcp-plugin-gen` to produce Cursor, Claude Code, OpenCode, etc. configs.

name = "ufm-mcp"
description = "MCP server for NVIDIA UFM InfiniBand fabric management and monitoring"
repository = "https://github.com/togethercomputer/mcp-common"
subdirectory = "servers/ufm-mcp"
license = "Apache-2.0"
keywords = ["mcp", "ufm", "nvidia", "infiniband", "fabric"]

[author]
name = "Together AI"

[server]
command = "uvx"
args = ["--from", "ufm-mcp", "ufm-mcp"]

[server.env]
UFM_URL = "${UFM_URL}"
UFM_TOKEN = "${UFM_TOKEN}"

[cli]
name = "ufm-cli"
entry_point = "ufm_mcp.cli:main"
description = "Investigate InfiniBand fabric health, BER, port errors, and UFM events from the command line"

# One [[skills]] entry per skills/<name>/SKILL.md directory; `name` matches the
# directory and `path` points at that directory's SKILL.md (the netbox/awx
# convention). Every skill dir must be registered here or generation skips it
# and the skill never reaches agents (enforced by tests/test_skill_registration.py).
[[skills]]
name = "fabric-monitoring"
description = "Use when investigating InfiniBand fabric issues, checking port health, UFM events, or diagnosing network topology problems. Triggers on mentions of UFM, InfiniBand, fabric, switch ports, or link errors."
path = "skills/fabric-monitoring/SKILL.md"

[[skills]]
name = "host-ibdiagnet-collect"
description = "Use when collecting host-side ibdiagnet evidence for SI/FEC/PHY triage on H100/H200/B200 InfiniBand hosts, when preparing support evidence for a flagged HCA, or when ad-hoc importing a fabric snapshot into Topaz. Triggers on host ibdiagnet, mlxlink, FEC investigation, signal integrity, port_fec_uncorrectable, ibdiagnet2.pm, Topaz collection import."
path = "skills/host-ibdiagnet-collect/SKILL.md"

[[skills]]
name = "ufm-fabric-ops"
description = "Use when investigating InfiniBand fabric issues, checking port health, UFM events, or diagnosing network topology problems. Triggers on mentions of UFM, InfiniBand, fabric, switch ports, or link errors."
path = "skills/ufm-fabric-ops/SKILL.md"

[[skills]]
name = "ufm-opensm-restart"
description = "Use when UFM's OpenSM appears stuck / silent, when fabric-wide NCCL throughput drops far below baseline across many node pairs with near-identical numbers, or when OpenSM is not master despite the local UFM being the DRBD primary. Triggers on osm_enhanced_qos_mgr_parse_config, ERR 0707, 'SM priority changed' clustered in time, stale opensm.log mtime, or symptoms of heavy-sweep-induced fabric churn."
path = "skills/ufm-opensm-restart/SKILL.md"

[[skills]]
name = "ufm-stale-inventory-recovery"
description = "Use when UFM under-reports HCAs on a host that ibstat/ibdiagnet say is healthy, when `ufm-cli inventory-doctor` reports `stale_anchor`, `ghost_ports`, or `record_undercount`, or when `system_record.guid` in UFM points at a pre-rebuild HCA. Triggers on UFM stale anchor, ghost ports, record undercount, post-HCA-swap inventory drift, peer=N/A on switch port to a healthy HCA."
path = "skills/ufm-stale-inventory-recovery/SKILL.md"

[[rules]]
name = "ufm-mcp"
path = "rules/ufm-mcp.mdc"

[[hooks]]
event = "SessionStart"
script = "hooks/setup-cli"
async = true

[marketplace]
categories = ["infrastructure", "networking"]
tags = ["infiniband", "fabric", "ufm", "monitoring"]
