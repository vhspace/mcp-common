name: "Setup uv + Python"
description: >-
  Shared setup for the CI and canary jobs: install uv, set up Python, and
  authenticate git so uv can clone the private mcp-common git pin used by
  servers/*. Run this AFTER actions/checkout — a local (``./``) composite action
  can only be resolved once the repository is checked out, so the checkout step
  stays in each calling job.
inputs:
  python-version:
    description: "Python version passed to actions/setup-python."
    required: false
    default: "3.13"
  token:
    description: >-
      GitHub token used to authenticate git for cloning the private mcp-common
      dependency. Pass ``secrets.GITHUB_TOKEN`` from the calling job; composite
      actions cannot read secrets directly.
    required: true
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    # servers/* pin mcp-common by git tag from this private repo; give the
    # runner's git the token so uv can clone it. No-op for the root project.
    - name: Authenticate git for private mcp-common dependency
      shell: bash
      run: git config --global url."https://x-access-token:${{ inputs.token }}@github.com/".insteadOf "https://github.com/"
